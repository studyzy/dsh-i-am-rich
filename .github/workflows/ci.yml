name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both ranges declared in package.json `engines.node`:
        # "^22.19.0 || >=24.0.0".
        node: ['22.19.0', '24.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from package.json `packageManager` (pnpm@11.7.0).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `check` is lint + typecheck + typecheck:tests + test + build,
      # so no separate build step is needed here.
      - name: Verify
        run: pnpm run check
