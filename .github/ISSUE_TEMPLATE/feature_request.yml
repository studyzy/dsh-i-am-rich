name: 功能建议
description: 提出一个新功能或改进（请注意：插件的核心前提是真实双倍花费，这一点不会改变）
title: '[Feature] '
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        ## 先说清楚边界

        本插件的核心前提是**故意重复发送请求**：第二份请求是真实到达 provider、真实计费的调用，
        只是它的响应被直接丢弃。这个前提是有意为之，不会为了「省钱」或「避免重复请求」而改动——
        这和插件的存在意义是矛盾的。

        因此，以下方向通常不会被接受：

        - 让第二份请求不真正发出去（例如本地伪造响应、只共享缓存）
        - 让重复请求不计费
        - 把「浪费」数字改成估算值、缩小显示，或干脆隐藏

        欢迎的方向是**围绕这个前提做增量**：更准的统计口径、更好的展示、更多的导出与告警能力等。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 描述痛点本身，而不是先给出方案。说清楚现在的行为哪里让你不舒服。
      placeholder: 例如：我希望知道浪费的钱折合人民币是多少，但现在只有 Token 数。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 你设想的方案
      description: 具体到你希望看到的行为：状态条上出现什么、配置项叫什么、触发时机是什么。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你试过或想过的其他做法，以及为什么它们不够好。也可以写「暂时没有」。
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 相关截图、其他工具的做法、你愿意自己提 PR 吗，等等。
    validations:
      required: false
